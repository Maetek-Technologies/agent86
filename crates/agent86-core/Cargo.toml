# The agent itself: the harness and its loop, the providers, tools, approvals,
# guardrails, sandbox, secret vault, memory, MCP client, sub-agents, skills, and
# telemetry. `agent86_core::sdk` is the embedding API, and the only part with a
# stability promise; every other module is public for the `agent86` binary.
[package]
name = "agent86-core"
description = "The agent behind agent86: a safe agent runtime you can embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/agent86-core"
homepage = "https://maetek-technologies.github.io/agent86/"
keywords = ["agent", "llm", "ai", "mcp", "sandbox"]
categories = ["artificial-intelligence", "development-tools", "security"]
# The tests read fixtures from the workspace's `tests/fixtures`, outside this
# crate, so they are left out of the published package rather than shipped
# broken; the example and the README's example (a doctest) stay.
exclude = ["tests/"]

# All on by default, so `agent86-core` alone behaves as the CLI does; an
# embedder that wants the lightest build turns them off with
# `default-features = false`.
[features]
default = ["os-keyring", "local-embeddings", "agent86ui"]
# The OS keyring (Windows Credential Manager, the macOS Keychain, the Secret
# Service), for provider keys and remembered secrets. Without it a lookup reads as
# "no key stored". The embedding API never reads the keyring either way.
os-keyring = [
    "dep:keyring-core",
    "dep:windows-native-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
# The local sentence-transformers embedder (candle and tokenizers) for long-term
# memory. Without it a `sentence-transformers:` spec falls back to the offline
# hash embedder with a note; the embedding API's `Memory::open` uses that one.
local-embeddings = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers"]
# agent86UI (ADR 0005): the `render_ui` tool, through which the model draws
# A2UI 1.0 surfaces that a renderer the embedder declares draws natively,
# validated by the `agent86-ui` crate. Without it neither the tool nor the
# `ui` event exists.
agent86ui = ["dep:agent86-ui"]

[dependencies]
agent86-ui = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
encoding_rs.workspace = true
futures-util.workspace = true
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
jiff.workspace = true
keyring-core = { workspace = true, optional = true }
md5.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true

[target."cfg(windows)".dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

# docs.rs documents the default features, as `cargo add agent86-core` builds.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
