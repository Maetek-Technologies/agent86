category = "tests"
measures = "writing tests: scored by whether they pass on the real code and catch six mutants, each breaking one documented rule"
timeout_s = 600
goal = "Write a thorough unittest suite for parse_duration (in duration.py) in tests/test_duration.py. It must pass against the current implementation, which is correct, and fail against any implementation that gets one of the behaviours its docstring describes wrong. Do not change duration.py."
check = ["{python}", "-m", "unittest", "discover", "-s", "eval_check", "-t", "."]
