category = "refactor"
measures = "a module turned into a package without breaking any import"
timeout_s = 600
goal = "Split utils.py into a package named utils: string helpers (normalize_space, title_case, initials) go in utils/strings.py, number helpers (clamp, percent) in utils/numbers.py, and chunks in utils/iterables.py. `from utils import <name>` must keep working for every function, utils.py must be gone, and app.py and report.py must keep working unchanged."
check = ["{python}", "-m", "unittest", "discover", "-s", "eval_check", "-t", "."]
