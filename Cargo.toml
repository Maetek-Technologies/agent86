[package]
name = "agent86"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A compatibility-first Rust implementation of the agent86 agentic harness"
repository = "https://github.com/tdfleming/agent-86-rs"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
