[package]
name = "agent86"
version = "1.0.5"
edition = "2021"
rust-version = "1.88"
description = "A compatibility-first Rust implementation of the agent86 agentic harness"
repository = "https://github.com/tdfleming/agent-86-rs"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
encoding_rs = "0.8.42"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap = { version = "2.14.2", features = ["serde"] }
keyring-core = "1.0.1"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha1_smol = "1.0.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "sync", "time"] }
toml_edit = "0.25"
toml = { version = "1.1.8", default-features = false, features = ["parse", "preserve_order", "serde"] }
unicode-width = "0.2"
url = "2.5.8"
md5 = "0.8.1"
# Pinned: candle 0.11's aarch64 NEON code uses float16 intrinsics that are not
# stable in the MSRV (1.88), so it does not build on Apple silicon.
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[target."cfg(windows)".dependencies]
crossterm_winapi = "0.9"
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

# gemm-common's fp16 NEON helpers (vmulq_f16 and friends) carry no fp16 target
# feature and only assemble once inlined into gemm-f16's fp16 kernels. Without
# optimization they are compiled on their own, which fails on aarch64 Linux
# (`instruction requires: fullfp16`); Apple's target enables fp16 by default.
# Optimizing the two crates in dev builds matches what release builds do.
[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3
