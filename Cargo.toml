[workspace]
members = ["crates/agent86-core", "crates/agent86-ui"]
resolver = "2"

# One version, edition, MSRV, and license for both crates. Set the version here
# only: the binary uses the library by path (no version of its own to bump), so
# the two always build from the same checkout. The release workflow and
# `npm/build.mjs` read the first `version = "..."` line of this file, which is
# this one.
[workspace.package]
version = "1.2.1"
edition = "2021"
rust-version = "1.94"
repository = "https://github.com/Maetek-Technologies/agent86"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
agent86-core = { path = "crates/agent86-core" }
# agent86-core's agent86UI feature. A published crate names its dependencies'
# versions, so this one is set to the workspace version at each release.
agent86-ui = { path = "crates/agent86-ui", version = "1.2.1" }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
crossterm_winapi = "0.9"
encoding_rs = "0.8.42"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = "0.4.21"
ignore = "0.4.34"
indexmap = { version = "2.14.2", features = ["serde"] }
# Local time and its offset for the prompt's time line and `memory`/`trace`
# listings. Replaced chrono (unmaintained, RUSTSEC-2026-0543) in 1.0.24.
jiff = "1.0.0"
# The A2UI regex dialect for agent86-ui: lookahead, with a backtracking limit
# on top of the dialect's static safety rules. rust-version 1.66.
fancy-regex = "0.20.2"
# JSON Schema 2020-12, for agent86-ui: A2UI catalogs are JSON Schema documents, so
# checking a component against its catalog needs a real validator. Without the
# default features it resolves no reference over the network or from files; the
# schemas it sees are the ones agent86-ui registers in memory. rust-version 1.85.
jsonschema = { version = "0.63.0", default-features = false }
keyring-core = "1.0.1"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha1_smol = "1.0.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "sync", "time"] }
toml_edit = "0.25"
toml = { version = "1.1.8", default-features = false, features = ["parse", "preserve_order", "serde"] }
unicode-width = "0.2"
url = "2.5.9"
md5 = "0.8.1"
sha2 = "0.11.1"
# candle 0.11 sets the MSRV: on x86_64 it calls `__cpuid_count` outside an
# `unsafe` block, which compiles only from Rust 1.94, where that intrinsic became
# safe (it also needs the AVX-512 target features stabilized in 1.89). 0.10 pulled
# in `zip` 7, with five advisories; 0.11 has `zip` 9.
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
windows-native-keyring-store = "1.1.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

# The `agent86` binary: the terminal interface, the REPL, `run`, the ACP server,
# and the CLI's config-driven assembly, on top of `agent86-core`.
[package]
name = "agent86"
description = "agent86, an agentic harness on the command line"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
agent86-core.workspace = true
clap.workspace = true
crossterm.workspace = true
indexmap.workspace = true
jiff.workspace = true
pulldown-cmark.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml_edit.workspace = true
unicode-width.workspace = true
url.workspace = true

[target."cfg(windows)".dependencies]
crossterm_winapi.workspace = true

[lints]
workspace = true

[dev-dependencies]
futures-util.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tokenizers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

# gemm-common's fp16 NEON helpers (vmulq_f16 and friends) carry no fp16 target
# feature and only assemble once inlined into gemm-f16's fp16 kernels. Without
# optimization they are compiled on their own, which fails on aarch64 Linux
# (`instruction requires: fullfp16`); Apple's target enables fp16 by default.
# Optimizing the two crates in dev builds matches what release builds do.
[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3
