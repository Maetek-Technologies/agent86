[package]
name = "agent86"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A compatibility-first Rust implementation of the agent86 agentic harness"
repository = "https://github.com/tdfleming/agent-86-rs"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
keyring-core = "1.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
