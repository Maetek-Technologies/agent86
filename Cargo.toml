[package]
name = "agent86"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A compatibility-first Rust implementation of the agent86 agentic harness"
repository = "https://github.com/tdfleming/agent-86-rs"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
