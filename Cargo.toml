[package]
name = "agent86"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A compatibility-first Rust implementation of the agent86 agentic harness"
repository = "https://github.com/tdfleming/agent-86-rs"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
