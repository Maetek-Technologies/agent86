name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices, publishes
# the result to api.scorecard.dev (which the README badge reads, and
# scorecard.dev/viewer shows check by check), and uploads it as SARIF so
# failing checks appear under Security > Code scanning.
#
# Publishing only works from the default branch, and Scorecard restricts this
# job while it publishes: no top-level `env` or `defaults`, an Ubuntu runner,
# and only the steps below (checkout, the action, upload-artifact,
# upload-sarif). Keep other work out of this workflow.

on:
  push:
    branches: [main]
  # Branch protection changes fire no event, so a weekly run catches them.
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result (keyless, OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
