name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-latest, windows-latest]
        toolchain: [stable, "1.94"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Both crates: agent86-core (the library) and agent86 (the binary).
      - name: Test
        run: cargo test --workspace --all-targets --locked
      # The library with neither optional feature (no OS keyring, no local
      # embedding model), as an embedder may build it; the keyring stub differs
      # per platform, so every OS runs it.
      - name: Test the library without default features
        if: matrix.toolchain == 'stable'
        run: cargo test -p agent86-core --no-default-features --lib --locked
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every dependency checked against the RustSec advisory database; deny.toml
      # holds any exception, with the reason agent86 is not affected.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories
