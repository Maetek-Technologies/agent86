name: Release

# A `v*` tag builds the binaries, publishes a GitHub release with them (its
# notes taken from `docs/releases/<tag>.md`) and their SLSA provenance,
# publishes the npm packages (`npm/build.mjs`), and publishes the library,
# `agent86-core`, to crates.io. A pull request that changes this workflow, the
# npm files, or the library's manifest runs everything but the publishing: the
# builds, the packages and the crate with a dry-run publish, and an install of
# the packed packages on Linux, macOS, and Windows.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "npm/**", "crates/agent86-core/Cargo.toml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on 22.04 (glibc 2.35): a binary needs a glibc at least as
          # new as the one it was built against, and 24.04's 2.39 would rule out
          # Debian and Raspberry Pi OS Bookworm (2.36) and Ubuntu 22.04.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the glibc it needs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          need=$(objdump -T "target/${{ matrix.target }}/release/agent86" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          # Bookworm's 2.36 must run it: fail if it needs anything newer than 2.35.
          [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35 ]
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="agent86-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/agent86.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/agent86" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          # The archives, one artifact per target triple; not the npm packages.
          pattern: "*-*"
          merge-multiple: true
      # The subjects of the SLSA provenance: `sha256sum` lines for every
      # archive, base64-encoded as the generator takes them.
      - name: Hash the archives
        id: hash
        run: |
          set -euo pipefail
          cd dist
          echo "hashes=$(sha256sum -- *.tar.gz *.zip | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "agent86 $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag

  # SLSA build provenance for the archives, signed keylessly through Sigstore
  # and attached to the release as `agent86-<tag>.intoto.jsonl` (verify with
  # `slsa-verifier verify-artifact`). OpenSSF Scorecard's Signed-Releases check
  # looks for that file among a release's assets.
  #
  # The one workflow here not pinned to a commit SHA: the generator checks how
  # it was referenced and refuses to run unless it is called by a release tag
  # (Scorecard's Pinned-Dependencies check exempts it for that reason).
  provenance:
    needs: release
    permissions:
      actions: read # read the workflow run the provenance describes
      id-token: write # keyless Sigstore signing
      contents: write # attach the provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      provenance-name: agent86-${{ github.ref_name }}.intoto.jsonl

  # The library on crates.io, once the release with the binary archives is out
  # (on a pull request, where there is no release, a dry run after the builds).
  # `cargo publish` packages the crate and builds it from the package alone
  # before uploading. The token is a crates.io API token scoped to publishing
  # `agent86-core`, kept as the repository secret `CARGO_REGISTRY_TOKEN`; the
  # dry run needs none.
  crate:
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'pull_request' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Publish agent86-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            # Packages and builds the crate as a publish would, without uploading;
            # cargo only warns when this version is already on crates.io.
            cargo publish -p agent86-core --locked --dry-run
            exit 0
          fi
          # A tag must name the version Cargo.toml has.
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml's $version"; exit 1
          fi
          # A re-run after a publish that went through skips it: crates.io never
          # takes the same version twice.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'agent86-release (https://github.com/Maetek-Technologies/agent86)' \
            "https://crates.io/api/v1/crates/agent86-core/$version")
          if [ "$status" = 200 ]; then
            echo "agent86-core@$version is already published"
            exit 0
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"; exit 1
          fi
          cargo publish -p agent86-core --locked

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance, and trusted publishing once it is set up per package.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: "*-*"
          merge-multiple: true
      - name: Unpack the binaries
        run: |
          set -euo pipefail
          mkdir -p bins
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C bins; done
          for archive in dist/*.zip; do unzip -q "$archive" -d bins; done
          ls bins
      - name: Assemble and pack
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # A tag must name the version Cargo.toml has.
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml's $version"; exit 1
          fi
          node npm/build.mjs --version "$version" --bins bins --out npm-out
          mkdir npm-tgz
          for dir in npm-out/*; do (cd npm-tgz && npm pack "../$dir"); done
          ls -l npm-tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm
          path: npm-tgz/*.tgz
          if-no-files-found: error
      # Trusted publishing: each package names this repository and workflow on
      # npmjs.com, and npm trades the job's OIDC token for the right to publish,
      # so no npm token is stored here.
      - name: Publish
        run: |
          set -euo pipefail
          field() {
            node -e 'const m = JSON.parse(process.argv[1]); console.log(m[process.argv[2]])' \
              "$(tar -xOzf "$1" package/package.json)" "$2"
          }
          publish() {
            local tgz=$1 name version
            name=$(field "$tgz" name)
            version=$(field "$tgz" version)
            if npm view "$name@$version" version > /dev/null 2>&1; then
              # A re-run after a partial publish skips what is already out, and so
              # does a pull request between releases, whose version is the last one
              # published (npm refuses even a dry run over it); npm-install still
              # checks those packages.
              echo "$name@$version is already published"
            elif [ "${GITHUB_REF_TYPE}" != tag ]; then
              npm publish "$tgz" --access public --dry-run
            else
              npm publish "$tgz" --access public --provenance
            fi
          }
          # The platform packages first, so the launcher never names a missing one.
          for tgz in ./npm-tgz/maetek-agent86-*.tgz; do
            publish "$tgz"
          done
          # A published package takes minutes to reach every reader of the
          # registry, and npm skips an optional dependency it cannot find without
          # a word: a launcher visible before its binaries installs with no binary
          # (seen with 1.0.20 on Windows). So the launcher waits until every
          # platform package can be read back. One that never appears fails the
          # job before the launcher is published; a re-run then skips what is out.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            for tgz in ./npm-tgz/maetek-agent86-*.tgz; do
              name=$(field "$tgz" name)
              version=$(field "$tgz" version)
              for attempt in $(seq 1 60); do
                if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
                  echo "$name@$version is visible"
                  break
                fi
                if [ "$attempt" -eq 60 ]; then
                  echo "::error::$name@$version is still not visible after 15 minutes; the launcher was not published"
                  exit 1
                fi
                sleep 15
              done
            done
          fi
          for tgz in ./npm-tgz/agent86-*.tgz; do
            publish "$tgz"
          done

  npm-install:
    needs: npm
    name: npm install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: windows-latest, platform: win32-x64 }
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm
          path: npm-tgz
      - name: Install the packed packages and run them
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/npm-global"
          # The platform package from its tarball, then the launcher without its
          # optional dependencies, which are not on the registry yet; the launcher
          # finds the platform package beside it in the global node_modules.
          npm install -g --prefix "$prefix" ./npm-tgz/maetek-agent86-${{ matrix.platform }}-*.tgz
          npm install -g --prefix "$prefix" --omit=optional ./npm-tgz/agent86-[0-9]*.tgz
          if [ "${{ runner.os }}" = Windows ]; then bin="$prefix/agent86.cmd"; else bin="$prefix/bin/agent86"; fi
          "$bin" --version
          "$bin" --version | grep -q '^agent86 [0-9]'
          # Exit statuses pass through the launcher: a usage error is 2.
          set +e
          "$bin" no-such-command 2> /dev/null
          status=$?
          set -e
          [ "$status" = 2 ] || { echo "expected exit status 2, got $status"; exit 1; }
